{% extends "base.html" %}
{% block title %}{{ 'Editar Producto' if modo == 'editar' else 'Nuevo Producto' }} · Inventario Dietética{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h1 class="h4 mb-3">{{ 'Editar Producto' if modo == 'editar' else 'Nuevo Producto' }}</h1>
                <form method="post" action="{{ url_for('productos.editar', id=producto.id) if modo == 'editar' else url_for('productos.nuevo') }}">
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre del Producto</label>
                        <input type="text" class="form-control" id="nombre" name="nombre" value="{{ datos.get('nombre', '') }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="categoria" class="form-label">Categoría</label>
                        <select class="form-select" id="categoria" name="categoria" required>
                            <option value="">Seleccionar categoría...</option>
                            {% for cat in categorias %}
                            <option value="{{ cat }}" {% if datos.get('categoria') == cat %}selected{% endif %}>{{ cat }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="precio_unitario" class="form-label">Precio Unitario ($)</label>
                            <input type="number" step="0.01" min="0" class="form-control" id="precio_unitario" name="precio_unitario" value="{{ datos.get('precio_unitario', '') }}" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="stock_actual" class="form-label">Stock Actual</label>
                            <input type="number" step="0.01" min="0" class="form-control" id="stock_actual" name="stock_actual" value="{{ datos.get('stock_actual', '') }}" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="unidad_medida" class="form-label">Unidad de Medida</label>
                            <select class="form-select" id="unidad_medida" name="unidad_medida" required>
                                <option value="">Seleccionar...</option>
                                {% for uni in unidades %}
                                <option value="{{ uni }}" {% if datos.get('unidad_medida') == uni %}selected{% endif %}>{{ uni }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-3">
                        <a href="{{ url_for('productos.index') }}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-success">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
